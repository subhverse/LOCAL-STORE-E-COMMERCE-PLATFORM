<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login • LOCAL STORE</title>
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <div id="navMount"></div>

    <div class="form-wrap">
      <div class="form-card glass">
        <h2>Welcome back</h2>
        <p class="muted">Login to access your cart and checkout.</p>

        <form id="loginForm">
          <div class="field">
            <label>Email</label>
            <input type="email" id="email" placeholder="you@example.com" required />
          </div>
          <div class="field">
            <label>Password</label>
            <input type="password" id="password" placeholder="••••••••" minlength="6" required />
          </div>
          <button class="btn primary" style="width:100%" type="submit">Login</button>
        </form>

        <p class="muted" style="margin-top:12px">
          New here? <a class="btn" href="/register.html">Create an account</a>
        </p>
      </div>
    </div>

    <script type="module" src="/js/login.js"></script>
  </body>
</html>
