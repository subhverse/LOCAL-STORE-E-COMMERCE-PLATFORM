<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register • LOCAL STORE</title>
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <div id="navMount"></div>

    <div class="form-wrap">
      <div class="form-card glass">
        <h2>Create account</h2>
        <p class="muted">Register to start shopping & ordering.</p>

        <form id="registerForm">
          <div class="field">
            <label>Full Name</label>
            <input type="text" id="name" placeholder="Your name" required />
          </div>
          <div class="field">
            <label>Email</label>
            <input type="email" id="email" placeholder="you@example.com" required />
          </div>
          <div class="field">
            <label>Password</label>
            <input type="password" id="password" minlength="6" placeholder="At least 6 characters" required />
          </div>
          <button class="btn primary" style="width:100%" type="submit">Create Account</button>
        </form>

        <p class="muted" style="margin-top:12px">
          Already have an account? <a class="btn" href="/login.html">Login</a>
        </p>
      </div>
    </div>

    <script type="module" src="/js/register.js"></script>
  </body>
</html>
