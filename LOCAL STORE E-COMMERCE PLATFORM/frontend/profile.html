<!DOCTYPE html>
<html lang="en">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <div id="navMount"></div>

    <div class="container" style="padding: 18px 0 60px">

            <h3>Your Profile</h3>
            <span class="muted">Account details</span>
          </div>
          <div id="profileMount"></div>
        </section>

        <section class="products glass" style="border-radius:16px; padding:16px">
          <div class="section-title">
            <h3>Your Orders</h3>
            <span class="muted">Order tracking</span>
          </div>
          <div id="ordersMount"></div>
        </section>
      </div>
    </div>

    <script type="module" src="/js/profile.js"></script>

</html>
